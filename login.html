<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FastPres</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img src="images/fastlogo.png" width="150" height="auto" alt="FastPres Logo" class="logo">
    
    <div class="signup-container"> 
        <h2>Login</h2>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        
        <button onclick="validateLogin()">Login</button>
        
        <div class="signup-link" style="margin-top: 15px;">
            Don't have an account? <a href="create.html">Sign up here</a>
        </div>
    </div>
    
    <script>
         function validateLogin() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        const users = JSON.parse(localStorage.getItem('users')) || [];

        const user = users.find(user => user.email === email && user.password === password);

        if (email === "admin@fastpres.com") {
            alert("Management login successful!");
            sessionStorage.setItem("loggedInUser", email); // Save admin email
            window.location.href = "management-dashboard.html";
            return;
        }

        if (user) {
            alert("Login successful!");
            sessionStorage.setItem("loggedInUser", user.email); // Save user email
            window.location.href = "index.html";
        } else {
            alert("Invalid email or password.");
        }
    }
    </script>
</body>
</html>
