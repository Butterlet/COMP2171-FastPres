<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancel Order - FastPres</title>
    <link rel="stylesheet" href="cancel-styles.css">
</head>
<body>

<header>
    <img src="images/fastlogo.png" alt="FastPres Logo">
    <nav>
        <a href="index.html">Home</a>
        <a href="upload.html">Upload Prescription</a>
        <a href="history.html">View Prescription History</a>
        <a href="trackOrder.html">Track Order Status</a>
        <a href="cancel.html">Cancel Order</a>
        <a href="login.html">Logout</a>
    </nav>
</header>

<div class="main-content">
    <div class="cancel-container">
        <h2>Cancel Your Order</h2>
        <p>Select an order from the list below to cancel it.</p>
        <div id="orderList">
            <p>Loading your orders...</p>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2025 FastPres. All rights reserved.</p>
</footer>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const userEmail = sessionStorage.getItem("loggedInUser"); // Get logged-in user's email
        const orderList = document.getElementById("orderList");

        if (!userEmail) {
            alert("You must be logged in to view your orders.");
            window.location.href = "login.html";
            return;
        }

        // Fetch orders for the logged-in user
        fetch(`fetch_prescriptions.php?userEmail=${encodeURIComponent(userEmail)}`)
            .then(response => response.json())
            .then(data => {
                orderList.innerHTML = ""; // Clear the loading message

                if (data.error) {
                    orderList.innerHTML = `<p>Error: ${data.error}</p>`;
                    return;
                }

                if (data.length === 0) {
                    orderList.innerHTML = "<p>No orders found.</p>";
                } else {
                    data.forEach((order, index) => {
                        const orderDiv = document.createElement("div");
                        orderDiv.classList.add("order-item");
                        orderDiv.innerHTML = `
                            <h3>Order ${index + 1}</h3>
                            <p><strong>Receiving Method:</strong> ${order.receiving_method}</p>
                            ${order.address && order.receiving_method === "delivery" ? `<p><strong>Address:</strong> ${order.address}</p>` : ""}
                            <button class="cancel-btn" data-file="${order.file_name}">Cancel Order</button>
                        `;
                        orderList.appendChild(orderDiv);
                    });

                    // Add event listeners to cancel buttons
                    document.querySelectorAll(".cancel-btn").forEach(button => {
                        button.addEventListener("click", function () {
                            const fileName = this.getAttribute("data-file");

                            if (confirm("Are you sure you want to cancel this order?")) {
                                fetch("cancelOrder.php", {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ fileName, userEmail })
                                })
                                    .then(response => response.json())
                                    .then(result => {
                                        if (result.success) {
                                            alert("Order canceled successfully.");
                                            this.parentElement.remove(); // Remove the order from the list
                                        } else {
                                            alert("Error canceling order: " + result.message);
                                        }
                                    })
                                    .catch(error => console.error("Error:", error));
                            }
                        });
                    });
                }
            })
            .catch(error => {
                orderList.innerHTML = "<p>Error loading orders. Please try again later.</p>";
                console.error("Error:", error);
            });
    });
</script>

</body>
</html>
